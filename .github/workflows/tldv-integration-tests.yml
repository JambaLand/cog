name: TLDV Integration Tests

on:
  push:
    branches:
      - main
      - claude/setup-composio-plugin-*
    paths:
      - 'integrations/tldv/**'
      - '.github/workflows/tldv-integration-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'integrations/tldv/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: integrations/tldv
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        working-directory: integrations/tldv
        env:
          TLDV_API_KEY: ${{ secrets.TLDV_API_KEY }}
        run: pytest tests/ -v --cov=. --cov-report=xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./integrations/tldv/coverage.xml
          flags: tldv-integration
          name: TLDV Integration Coverage

      - name: Check code style
        working-directory: integrations/tldv
        run: |
          pip install ruff
          ruff format --check . || true
          ruff check . || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security check
        working-directory: integrations/tldv
        run: bandit -r . -ll || true

      - name: Check dependencies for vulnerabilities
        working-directory: integrations/tldv
        run: |
          pip install -r requirements.txt
          safety check --json || true

  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./integrations/tldv
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
